<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reverse Rotating Wheel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="wheel" id="wheel">
        <div class="segment red"></div>
        <div class="segment blue"></div>
        <div class="segment yellow"></div>
        <div class="segment green"></div>
      </div>

      <script>
        const wheel = document.getElementById("wheel");
        let angle = 0;
        let forwardInterval = null;
        let reverseInterval = null;
      
        wheel.addEventListener("mouseenter", () => {
          // Stop any reverse animation
          if (reverseInterval) {
            clearInterval(reverseInterval);
            reverseInterval = null;
          }
      
          // Start forward rotation if not already running
          if (!forwardInterval) {
            forwardInterval = setInterval(() => {
              angle += 5; // You can change speed here
              wheel.style.transform = `rotate(${angle}deg)`;
            }, 16); // ~60fps
          }
        });
      
        wheel.addEventListener("mouseleave", () => {
          // Stop forward rotation
          clearInterval(forwardInterval);
          forwardInterval = null;
      
          // Start reverse animation back to 0
          reverseInterval = setInterval(() => {
            if (angle <= 0) {
              clearInterval(reverseInterval);
              reverseInterval = null;
              angle = 0;
              wheel.style.transform = `rotate(0deg)`;
            } else {
              angle -= 5;
              wheel.style.transform = `rotate(${angle}deg)`;
            }
          }, 16);
        });
      </script>
      

</body>
</html>
